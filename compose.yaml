services:

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    ports:
      - "8000:8000"

    env_file:
      - ./backend/.env

    restart: unless-stopped

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health')"
        ] 
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

    networks:
      - yolo-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    volumes:
      - frontend-dist:/output  
    
    restart: "no" 
    # frontend container bay gio khong con la webserver nua
    # vi vay, container sau khi build xong thi co the thoat


    networks:
      - yolo-network


  nginx:
    image: nginx:alpine

    ports:
      - "8080:80"

    volumes:
      - frontend-dist:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # NGINX se doc volum frontend/dists nay
      # ro la read-only, NGINX chi read, ko fix


    restart: unless-stopped

    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget --no-verbose --tries=1 --spider http://127.0.0.1/ || exit 1"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

    networks:
      - yolo-network


volumes:
  frontend-dist:


networks:
  yolo-network:
    driver: bridge